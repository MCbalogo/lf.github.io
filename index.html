<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tanauan City Hazard Map</title>

<!-- Leaflet CSS + JS (CDN) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Tailwind (Play CDN: fine for prototypes; for production, build Tailwind via CLI) -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  html, body { height: 100%; margin: 0; font-family: 'Public Sans', system-ui, sans-serif; }
  #map { height: 100%; width: 100%; }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .haz-popup h3 { margin: 0 0 4px; font-weight: 700; font-size: 14px; }
  .haz-popup p  { margin: 2px 0; font-size: 12.5px; line-height: 1.4; }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; color:#fff; }
  /* Custom switch */
  .switch input { position:absolute; opacity:0; }
  .switch .track { width:38px; height:22px; border-radius:999px; background:#cbd5e1; transition:background .15s; position:relative; flex:none; }
  .switch .track::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch input:checked + .track.flood { background:#2563eb; }
  .switch input:checked + .track.slide { background:#ea580c; }
  .switch input:checked + .track::after { transform:translateX(16px); }
  .switch input:focus-visible + .track { outline:2px solid #0f172a; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { .switch .track, .switch .track::after { transition:none; } }
</style>
</head>

<body class="bg-slate-100 text-slate-800">
<div class="flex flex-col md:flex-row h-full">

  <!-- ============ SIDEBAR ============ -->
  <aside class="md:w-80 w-full md:h-full max-h-[45%] md:max-h-none overflow-y-auto bg-white border-b md:border-b-0 md:border-r border-slate-200 z-[1000] shadow-lg">
    <div class="p-5 border-b border-slate-200">
      <h1 class="text-xl font-bold leading-tight">Tanauan City Hazard Map</h1>
      <p class="text-sm text-slate-500 mt-1">Batangas, Philippines. Flood and landslide susceptibility.</p>
    </div>

    <!-- Search / locate -->
    <section class="p-5 border-b border-slate-200">
      <label for="brgy" class="block text-sm font-semibold mb-2">Go to barangay</label>
      <select id="brgy" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
        <option value="">Select a barangay…</option>
      </select>
      <input id="brgySearch" type="search" placeholder="Or type to filter (e.g. Darasa)"
             class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800" />
      <p id="searchMsg" class="text-xs text-slate-500 mt-1 min-h-[1rem]"></p>
    </section>

    <!-- Layer toggles -->
    <section class="p-5 border-b border-slate-200">
      <h2 class="text-sm font-semibold mb-3">Hazard layers</h2>
      <label class="switch relative flex items-center gap-3 py-2 cursor-pointer">
        <input type="checkbox" id="toggleFlood" checked />
        <span class="track flood"></span>
        <span class="text-sm">Flood-prone areas</span>
      </label>
      <label class="switch relative flex items-center gap-3 py-2 cursor-pointer">
        <input type="checkbox" id="toggleSlide" checked />
        <span class="track slide"></span>
        <span class="text-sm">Landslide-prone areas</span>
      </label>

      <label for="opacity" class="block text-sm font-semibold mt-4 mb-1">Layer opacity</label>
      <input id="opacity" type="range" min="10" max="90" value="45" class="w-full accent-slate-800" />
    </section>

    <section class="p-5 text-xs text-slate-500 leading-relaxed">
      <p><strong class="text-slate-700">Sample data only.</strong> The zones shown are illustrative and are not official hazard boundaries. For planning or evacuation decisions, use data from Project NOAH, MGB, or the Tanauan CDRRMO.</p>
    </section>
  </aside>

  <!-- ============ MAP ============ -->
  <main class="flex-1 relative min-h-0">
    <div id="map" aria-label="Hazard map of Tanauan City"></div>
  </main>
</div>

<script>
/* =====================================================================
   1. MAP INITIALIZATION
   ===================================================================== */
const TANAUAN_CENTER = [14.0833, 121.1500];   // [lat, lng]  (Leaflet uses lat first)
const DEFAULT_ZOOM = 13;

const map = L.map('map', { zoomControl: true }).setView(TANAUAN_CENTER, DEFAULT_ZOOM);

// Standard OpenStreetMap tiles
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

/* =====================================================================
   2. HAZARD DATA (MOCK / SAMPLE)
   ---------------------------------------------------------------------
   HOW TO PLUG IN REAL DATA
   - Official hazard maps (Project NOAH, MGB, PHIVOLCS) come as shapefiles.
     Convert them to GeoJSON in WGS84 (EPSG:4326), e.g. with QGIS
     (Export > Save Features As > GeoJSON, CRS EPSG:4326) or
     `ogr2ogr -f GeoJSON -t_srs EPSG:4326 out.geojson in.shp`.
   - IMPORTANT: GeoJSON coordinates are [longitude, latitude].
     (Leaflet's own L.latLng / setView use [latitude, longitude].)
   - Then either:
       a) paste the FeatureCollection into FLOOD_DATA / LANDSLIDE_DATA below, or
       b) load it from a file:
            fetch('data/flood.geojson').then(r => r.json()).then(d => floodLayer.addData(d));
          (serve the page via a local web server, e.g. `python -m http.server`)
   - Each feature should have properties { name, level, action } where
     level is "High" or "Moderate". If your dataset uses other property
     names or codes (e.g. NOAH's "Var" = 1/2/3, MGB's "LSSUSC"), map them
     in normalizeLevel() below.
   ===================================================================== */

// ---- Sample FLOOD zones (lake shore + river corridor + low-lying poblacion)
const FLOOD_DATA = {
  type: 'FeatureCollection',
  features: [
    { type: 'Feature',
      properties: { name: 'Taal Lake shoreline (sample)', level: 'High',
                    action: 'Monitor water levels and prepare for evacuation during heavy rain or lake surge.' },
      geometry: { type: 'Polygon', coordinates: [[
        [121.108,14.060],[121.128,14.052],[121.150,14.058],[121.152,14.070],
        [121.135,14.076],[121.115,14.074],[121.108,14.060]
      ]] } },
    { type: 'Feature',
      properties: { name: 'Lakeside low-lying belt (sample)', level: 'Moderate',
                    action: 'Stay alert to advisories. Keep an emergency bag ready and know your evacuation center.' },
      geometry: { type: 'Polygon', coordinates: [[
        [121.100,14.074],[121.115,14.080],[121.135,14.083],[121.152,14.078],
        [121.150,14.092],[121.128,14.094],[121.104,14.088],[121.100,14.074]
      ]] } },
    { type: 'Feature',
      properties: { name: 'River corridor (sample)', level: 'High',
                    action: 'Avoid river banks during storms. Move valuables to higher floors and monitor water levels.' },
      geometry: { type: 'Polygon', coordinates: [[
        [121.178,14.118],[121.184,14.116],[121.170,14.098],[121.160,14.084],
        [121.152,14.072],[121.146,14.076],[121.156,14.092],[121.168,14.106],[121.178,14.118]
      ]] } },
    { type: 'Feature',
      properties: { name: 'Poblacion low-lying area (sample)', level: 'Moderate',
                    action: 'Check drainage and clear canals. Prepare for possible street flooding.' },
      geometry: { type: 'Polygon', coordinates: [[
        [121.138,14.090],[121.158,14.090],[121.162,14.102],[121.148,14.108],[121.136,14.100],[121.138,14.090]
      ]] } }
  ]
};

// ---- Sample LANDSLIDE zones (elevated / sloping terrain to the north-east)
const LANDSLIDE_DATA = {
  type: 'FeatureCollection',
  features: [
    { type: 'Feature',
      properties: { name: 'Upland slope (sample)', level: 'High',
                    action: 'Watch for cracks, tilting trees, or muddy streams. Prepare to evacuate during prolonged rain.' },
      geometry: { type: 'Polygon', coordinates: [[
        [121.185,14.120],[121.205,14.126],[121.214,14.110],[121.204,14.096],[121.188,14.100],[121.185,14.120]
      ]] } },
    { type: 'Feature',
      properties: { name: 'Foothill transition (sample)', level: 'Moderate',
                    action: 'Avoid building on steep cuts. Monitor slopes after heavy rain.' },
      geometry: { type: 'Polygon', coordinates: [[
        [121.168,14.122],[121.186,14.134],[121.206,14.140],[121.216,14.126],
        [121.205,14.126],[121.185,14.120],[121.176,14.112],[121.168,14.122]
      ]] } },
    { type: 'Feature',
      properties: { name: 'Southern ridge (sample)', level: 'Moderate',
                    action: 'Report new slope cracks to your barangay. Keep drainage paths clear.' },
      geometry: { type: 'Polygon', coordinates: [[
        [121.176,14.062],[121.194,14.066],[121.198,14.052],[121.184,14.044],[121.174,14.052],[121.176,14.062]
      ]] } }
  ]
};

/* =====================================================================
   3. STYLING + POPUPS
   ===================================================================== */
const COLORS = {
  flood: { High: '#1d4ed8', Moderate: '#60a5fa' },     // dark blue / light blue
  slide: { High: '#dc2626', Moderate: '#fb923c' }      // red / orange
};
let fillOpacity = 0.45;

// Normalize real-world attribute values into "High" | "Moderate".
// EDIT THIS when you load official data with different property names/codes.
function normalizeLevel(props) {
  const v = String(props.level ?? props.Var ?? props.LSSUSC ?? '').toLowerCase();
  if (v === 'high' || v === '3' || v.startsWith('h')) return 'High';
  return 'Moderate';
}

function makeLayer(data, kind, label) {
  return L.geoJSON(data, {
    style: f => {
      const c = COLORS[kind][normalizeLevel(f.properties)];
      return { color: c, weight: 1.5, fillColor: c, fillOpacity };
    },
    onEachFeature: (f, layer) => {
      const lvl = normalizeLevel(f.properties);
      const c = COLORS[kind][lvl];
      layer.bindPopup(`
        <div class="haz-popup">
          <h3>${label}</h3>
          <p><span class="badge" style="background:${c}">${lvl} Risk</span></p>
          <p><strong>Hazard Level:</strong> ${lvl} Risk</p>
          <p><strong>Zone:</strong> ${f.properties.name ?? 'Unnamed zone'}</p>
          <p><strong>Recommended Action:</strong> ${f.properties.action ?? 'Follow local advisories.'}</p>
          <p style="color:#64748b">Sample data, not official.</p>
        </div>`);
      layer.on('mouseover', () => layer.setStyle({ weight: 3 }));
      layer.on('mouseout',  () => layer.setStyle({ weight: 1.5 }));
    }
  });
}

const floodLayer = makeLayer(FLOOD_DATA, 'flood', 'Flood-Prone Area').addTo(map);
const slideLayer = makeLayer(LANDSLIDE_DATA, 'slide', 'Landslide-Prone Area').addTo(map);

/* =====================================================================
   4. LAYER CONTROLS
   ===================================================================== */
function bindToggle(id, layer) {
  document.getElementById(id).addEventListener('change', e => {
    e.target.checked ? layer.addTo(map) : map.removeLayer(layer);
  });
}
bindToggle('toggleFlood', floodLayer);
bindToggle('toggleSlide', slideLayer);

document.getElementById('opacity').addEventListener('input', e => {
  fillOpacity = e.target.value / 100;
  [floodLayer, slideLayer].forEach(l => l.setStyle({ fillOpacity }));
});

/* =====================================================================
   5. LEGEND (floating, bottom-right)
   ===================================================================== */
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div');
  d.className = 'bg-white/95 rounded-xl shadow-lg p-3 text-xs text-slate-700';
  const row = (c, t) => `<div class="flex items-center gap-2 py-0.5">
      <span style="background:${c};opacity:.75" class="inline-block w-4 h-4 rounded-sm border border-black/10"></span>${t}</div>`;
  d.innerHTML = `
    <div class="font-semibold mb-1">Legend</div>
    ${row(COLORS.flood.High, 'Flood prone: High')}
    ${row(COLORS.flood.Moderate, 'Flood prone: Moderate')}
    ${row(COLORS.slide.High, 'Landslide prone: High')}
    ${row(COLORS.slide.Moderate, 'Landslide prone: Moderate')}`;
  L.DomEvent.disableClickPropagation(d);
  return d;
};
legend.addTo(map);

/* =====================================================================
   6. BARANGAY SEARCH / LOCATE
   ---------------------------------------------------------------------
   Coordinates below are APPROXIMATE centroids for navigation only.
   Replace with exact centroids from the official barangay boundary
   dataset (e.g. PSA / NAMRIA / PhilGIS) when available.
   Format: [name, lat, lng, zoom]
   ===================================================================== */
const BARANGAYS = [
  ['Barangay 1 (Poblacion)', 14.0858, 121.1497, 17],
  ['Barangay 2 (Poblacion)', 14.0866, 121.1510, 17],
  ['Barangay 3 (Poblacion)', 14.0850, 121.1520, 17],
  ['Barangay 4 (Poblacion)', 14.0842, 121.1488, 17],
  ['Barangay 5 (Poblacion)', 14.0874, 121.1478, 17],
  ['Barangay 6 (Poblacion)', 14.0832, 121.1505, 17],
  ['Barangay 7 (Poblacion)', 14.0880, 121.1530, 17],
  ['Altura Bata',     14.0990, 121.1330, 15],
  ['Ambulong',        14.0600, 121.1250, 15],
  ['Bagbag',          14.1050, 121.1700, 15],
  ['Boot',            14.0770, 121.1230, 15],
  ['Darasa',          14.1010, 121.1620, 15],
  ['Hidalgo',         14.0905, 121.1400, 15],
  ['Janopol Oriental',14.1120, 121.1450, 15],
  ['Malaking Pulo',   14.0640, 121.1350, 15],
  ['Sambat',          14.0700, 121.1480, 15],
  ['Santor',          14.0950, 121.1550, 15],
  ['Wawa',            14.0620, 121.1170, 15]
];

const select = document.getElementById('brgy');
const search = document.getElementById('brgySearch');
const msg = document.getElementById('searchMsg');

function renderOptions(filter = '') {
  const f = filter.trim().toLowerCase();
  select.innerHTML = '<option value="">Select a barangay…</option>';
  BARANGAYS.forEach(([name], i) => {
    if (!f || name.toLowerCase().includes(f)) {
      select.insertAdjacentHTML('beforeend', `<option value="${i}">${name}</option>`);
    }
  });
  msg.textContent = f && select.options.length === 1 ? 'No barangay matches that search.' : '';
}
renderOptions();

let marker = null;
function flyToBarangay(i) {
  const [name, lat, lng, zoom] = BARANGAYS[i];
  map.flyTo([lat, lng], zoom, { duration: 1.2 });   // smooth pan + zoom
  if (marker) map.removeLayer(marker);
  marker = L.marker([lat, lng]).addTo(map).bindPopup(`<strong>${name}</strong>`).openPopup();
}

select.addEventListener('change', () => { if (select.value !== '') flyToBarangay(+select.value); });
search.addEventListener('input', () => renderOptions(search.value));
search.addEventListener('keydown', e => {
  if (e.key === 'Enter' && select.options.length > 1) {
    select.selectedIndex = 1;
    flyToBarangay(+select.value);
  }
});
</script>
</body>
</html>
